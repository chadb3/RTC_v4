jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore RTC_v4.slnx
      - name: Build
        run: dotnet build RTC_v4.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test RTC_v4.slnx --configuration Release --no-build --verbosity normal