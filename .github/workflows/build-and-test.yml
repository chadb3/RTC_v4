# Builds the solution and runs the xunit tests in Ray_Tracer_Tests
# on every push and on pull requests targeting master.
 
name: Build and Test

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

on:
  push:
  pull_request:
    branches: ["master"]
 
jobs:
  test:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout
        uses: actions/checkout@v7
 
      - name: Setup .NET
        uses: actions/setup-dotnet@v7
        with:
          dotnet-version: "10.0.x"
 
      - name: Restore dependencies
        run: dotnet restore RTC_v4.slnx
 
      - name: Build
        run: dotnet build RTC_v4.slnx --configuration Release --no-restore
 
      - name: Run tests
        run: dotnet test RTC_v4.slnx --configuration Release --no-build --verbosity normal